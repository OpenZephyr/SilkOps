# SilkOps CI: Tier 1 gates every push; the release job publishes the tarball the
# ci-cd factory pins (plan KTD10). Tier 2 evals run on demand (claude plugin eval is
# early-access and non-gating).
stages: [test, release]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^silkops-harness--v/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

tier1:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash jq curl python3 shellcheck git ca-certificates >/dev/null
  script:
    - bash tests/run.sh
    - shellcheck -x -P ops ops/*.sh ops/lib/*.sh ops/lib/providers/*.sh bin/silkops scripts/*.sh scripts/lib/*.sh
    - python3 ops/render-runbook.py   # rendered here, never committed (KTD5)
    # Verification gate: no merge verb, no protected-branch write, anywhere in skills/ or ops/.
    # token-check.sh's read of protected_branches is the one sanctioned hit.
    - bash scripts/gate-no-merge.sh --self-test
    - bash scripts/gate-no-merge.sh
    # plugin.json and marketplace.json must agree on the version (release.sh checks the tag against plugin.json).
    - test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
  artifacts:
    paths: [references/runbook.md]
    expire_in: 30 days

tier1-py39:
  # ops/*.py target Python 3.9 (AGENTS.md); tier1's debian image runs 3.11, so a 3.10+ construct
  # would pass there and fail on a 3.9 runtime (#20). The unittest step alone, on 3.9.
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null
  script:
    - python3 --version
    - python3 -m unittest discover -s tests/ops -p 'test_*.py'

overlay-gate:
  # void-mirror (the private overlay branch) may only add files under overlay/ (KTD2).
  stage: test
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "void-mirror"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash jq git ca-certificates >/dev/null
    - git fetch -q origin main:refs/remotes/origin/main
  script:
    - bash scripts/gate-overlay-only.sh --base origin/main

manifest:
  stage: test
  image: node:22-bookworm-slim
  script:
    - npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
    - claude plugin validate --strict .
  allow_failure: true   # only the CLI install/validate is allowed to flake; the version parity check gates in tier1

release:
  stage: release
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^silkops-harness--v/'
  variables:
    GIT_DEPTH: 0   # the notes read the history back to the previous silkops-harness--v* tag
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash jq curl git python3 ca-certificates >/dev/null
  script:
    - bash scripts/release.sh
  artifacts:
    paths: [dist/]
    expire_in: 30 days

github-release:
  # Optional: the same release on the GitHub mirror, only when a masked GH_TOKEN CI variable exists
  # (a token with contents:write on OpenZephyr/SilkOps). Without it the operator runs
  # scripts/github-release.sh by hand. gh comes from the pinned release tarball for the arch.
  stage: release
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^silkops-harness--v/ && $GH_TOKEN'
  variables:
    GIT_DEPTH: 0
    GH_CLI_VERSION: "2.74.0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash jq curl git ca-certificates >/dev/null
    - arch="$(dpkg --print-architecture)"
    - curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_${arch}.tar.gz" | tar -xz -C /usr/local --strip-components=1 "gh_${GH_CLI_VERSION}_linux_${arch}/bin/gh"
    - gh --version
  script:
    - bash scripts/github-release.sh --repo OpenZephyr/SilkOps --tag "$CI_COMMIT_TAG" --update
  artifacts:
    paths: [dist/]
    expire_in: 30 days
